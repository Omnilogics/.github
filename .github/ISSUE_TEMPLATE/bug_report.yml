name: Bug Report
description: Create a report to help us reproduce and fix a bug
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible to help us diagnose and fix the problem quickly.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the problem...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
      placeholder: What should have happened...
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or Logs
      description: If applicable, add screenshots, video recordings, or terminal / console logs to help explain the problem.
      placeholder: Paste logs, error traces, or drag and drop images here...
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Relevant OS, browser, application version, runtime, or dependencies.
      placeholder: "e.g., macOS Sonoma 14.5, Node.js 20.x, Chrome 124"
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context, references, or related issues.
    validations:
      required: false
  - type: checkboxes
    id: confirmations
    attributes:
      label: Checklist
      description: Please verify before submitting.
      options:
        - label: I have searched existing issues to ensure this is not a duplicate.
          required: true
        - label: I have provided all necessary reproduction steps and context.
          required: true
